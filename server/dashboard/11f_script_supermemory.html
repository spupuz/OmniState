<script>
// ---------- Supermemory ----------
async function loadSupermemory() {
  try {
    const status = await api('/api/supermemory/status');
    const badge = $('sm-status');
    if (badge) {
      if (status.status === 'configured') {
        badge.textContent = '✅ Connected';
        badge.className = 'chip ok';
      } else {
        badge.textContent = '⚠️ ' + (status.error || 'Not configured');
        badge.className = 'chip danger';
      }
      badge.title = `Base URL: ${status.base_url} · Space: ${status.default_space}`;
    }
    // Check for updates
    updateSupermemoryStatus();
    if (status.status === 'configured') {
      loadSupermemoryRecent();
    } else {
      const container = $('sm-recent-memories');
      if (container) container.innerHTML = '<p class="text-slate-400 text-sm">Supermemory not configured.</p>';
    }
  } catch (e) {
    console.error(e);
    const badge = $('sm-status');
    if (badge) {
      badge.textContent = '❌ Error';
      badge.className = 'chip danger';
    }
  }
}

async function updateSupermemoryStatus() {
  try {
    const res = await api('/api/supermemory/update-check', { cache: 'no-store' });
    const updateBadge = $('sm-update-status');
    if (!updateBadge) return;
    if (res.update_available && res.latest && res.latest !== res.current) {
      updateBadge.textContent = `📦 Update ${res.current} → ${res.latest} available`;
      updateBadge.className = 'chip warning';
      updateBadge.title = 'Click "Check for Updates" to apply';
    } else {
      updateBadge.classList.add('hidden');
    }
  } catch (e) {
    console.error('Failed to check for updates', e);
  }
}

async function checkSupermemoryUpdate() {
  try {
    const updateBadge = $('sm-update-status');
    if (updateBadge) {
      updateBadge.textContent = '⏳ Checking…';
      updateBadge.className = 'chip';
    }
    const res = await api('/api/supermemory/update-check', { cache: 'no-store' });
    if (updateBadge) {
      if (res.update_available && res.latest && res.latest !== res.current) {
        // Show custom modal instead of confirm()
        $('sm-update-current').textContent = res.current;
        $('sm-update-latest').textContent = res.latest;
        $('sm-update-modal').classList.remove('hidden');
      } else {
        showSmUpdateResult('No update available.', false);
      }
    }
  } catch (e) {
    console.error(e);
    showSmUpdateResult('Failed to check for updates', true);
  }
}

function closeSmUpdateModal() {
  $('sm-update-modal').classList.add('hidden');
}

async function applySmUpdate() {
  closeSmUpdateModal();
  try {
    const applyRes = await api('/api/supermemory/update', { method: 'POST' });
    if (applyRes.message && !applyRes.error) {
      showSmUpdateResult(applyRes.message + (applyRes.restart_required ? ' (restart required)' : ''), false);
      updateSupermemoryStatus();
    } else {
      showSmUpdateResult('Update failed: ' + (applyRes.error || 'Unknown error'), true);
    }
  } catch (e) {
    showSmUpdateResult('Update failed: ' + e.message, true);
  }
}

function showSmUpdateResult(message, isError) {
  const title = $('sm-update-result-title');
  const msgEl = $('sm-update-result-message');
  if (title) title.textContent = isError ? 'Update Failed' : 'Update Result';
  if (msgEl) msgEl.textContent = message;
  $('sm-update-result-modal').classList.remove('hidden');
}

function closeSmUpdateResultModal() {
  $('sm-update-result-modal').classList.add('hidden');
}

async function loadSupermemoryRecent() {
  try {
    const res = await api('/api/supermemory/search?q=&limit=10&scope=all');
    const container = $('sm-recent-memories');
    if (!container) return;
    container.innerHTML = (res && Array.isArray(res.results) && res.results.length) ? res.results.map(r => `
      <div class="glass p-3 mb-2" role="listitem">
        <p class="font-semibold">${esc(r.title || '(untitled)')}</p>
        <p class="text-sm text-slate-400 mt-1 whitespace-pre-wrap">${esc((r.content||'').slice(0, 200))}</p>
        <div class="flex gap-2 mt-2 flex-wrap">
          <span class="chip">ns: ${esc(r.namespace)}</span>
          <span class="chip">score: ${(r.score||0).toFixed(2)}</span>
        </div>
      </div>`).join('') : '<p class="text-slate-400 text-sm">No memories yet.</p>';
  } catch (e) {
    console.error(e);
    const container = $('sm-recent-memories');
    if (container) container.innerHTML = '<p class="text-slate-400 text-sm">Failed to load recent memories.</p>';
  }
}

let _smSearchSourceElement = null;
function supermemorySearch() {
  _smSearchSourceElement = document.activeElement;
  const modal = $('sm-search-modal');
  if (modal) {
    modal.classList.remove('hidden');
    const input = $('sm-search-input');
    if (input) { input.value = ''; input.focus(); }
  }
}

function closeSmSearchModal() {
  const modal = $('sm-search-modal');
  if (modal) {
    modal.classList.add('hidden');
    if (_smSearchSourceElement) {
      _smSearchSourceElement.focus();
      _smSearchSourceElement = null;
    }
  }
}

async function submitSmSearch() {
  const q = $('sm-search-input').value.trim();
  if (!q) return;
  closeSmSearchModal();
  const namespace = $('sm-namespace')?.value || '';
  const container = $('sm-search-results');
  if (container) container.innerHTML = '<div class="glass p-4 mb-3" role="listitem">' + [1,2,3].map(()=>'<div class="skel mb-2" style="height:1rem"></div>').join('') + '</div>';
  try {
    const results = await api('/api/supermemory/search?q=' + encodeURIComponent(q) + '&namespace=' + encodeURIComponent(namespace) + '&limit=20');
    if (container) {
      container.innerHTML = results.results.length ? results.results.map(r => `
        <div class="glass p-4 mb-3" role="listitem">
          <div class="flex justify-between gap-4 flex-wrap">
            <p class="font-semibold">${esc(r.title || '(untitled)')}</p>
            <span class="text-xs text-slate-500">${esc(r.namespace)}</span>
            <span class="text-xs text-slate-500">score: ${(r.score||0).toFixed(2)}</span>
          </div>
          <p class="text-sm text-slate-400 mt-1 whitespace-pre-wrap">${esc((r.content||'').slice(0, 380))}</p>
        </div>`).join('') : '<p class="text-slate-400 text-sm">No results.</p>';
    }
  } catch (e) {
    console.error(e);
    toast('Search failed: ' + e.message, 'err');
  }
}

async function addSupermemoryMemory() {
  const content = $('sm-content')?.value?.trim();
  const namespace = $('sm-namespace')?.value?.trim();
  if (!content) return;
  const btn = document.querySelector('#tab-supermemory form button[type="submit"]');
  const original = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    await api('/api/supermemory/add', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({content, namespace: namespace || undefined})
    });
    $('sm-content').value = '';
    $('sm-namespace').value = '';
    toast('Memory saved to Supermemory', 'ok');
    loadSupermemoryRecent();
  } catch (e) {
    toast('Save failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = original; }
  }
}

async function supermemorySync() {
  const btn = document.querySelector('#tab-supermemory .btn.ghost[onclick="supermemorySync()"]');
  const original = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Syncing…'; }
  try {
    await api('/api/supermemory/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({})});
    toast('Sync completed', 'ok');
    loadSupermemoryRecent();
  } catch (e) {
    toast('Sync failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = original; }
  }
}

document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); const pal=$('palette'); if(pal && !pal.classList.contains('hidden')) closePalette(); else openPalette(); }
  else if(e.key==='Escape'){
    const sidebar=$('sidebar');
    const sidebarOpen = sidebar && sidebar.classList.contains('open');
    if (sidebarOpen) { closeSidebarMobile(); }
    closePalette();
    closeForgetModal();
    closeRemoveModal();
    closeMergeModal();
    closeSmSearchModal && closeSmSearchModal();
    closeSmUpdateModal && closeSmUpdateModal();
    closeSmUpdateResultModal && closeSmUpdateResultModal();
    const savedMenu=$('saved-searches-menu'); if(savedMenu) savedMenu.classList.remove('open');
  }
  else if(e.key==='t' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA' && document.activeElement.tagName!=='SELECT'){ toggleTheme(); }
  else if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){ e.preventDefault(); switchTab('search'); const q=$('search-q'); if(q) q.focus(); }
});
(function(){
  const pal=$('palette'); if(!pal) return;
  pal.addEventListener('click', e=>{ if(e.target===pal) closePalette(); });
  const inp=$('palette-input'); if(!inp) return;
  inp.addEventListener('input', ()=> renderPalette(inp.value));
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ const a=document.querySelector('#palette-list .palette-item.active'); if(a) a.click(); }
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      const items=[...document.querySelectorAll('#palette-list .palette-item')];
      if(!items.length) return;
      let idx=items.findIndex(x=>x.classList.contains('active'));
      if(idx >= 0) {
        items[idx].classList.remove('active');
        items[idx].setAttribute('aria-selected', 'false');
      }
      idx = e.key==='ArrowDown' ? Math.min(items.length-1, idx+1) : Math.max(0, idx-1);
      items[idx].classList.add('active');
      items[idx].setAttribute('aria-selected', 'true');
      e.target.setAttribute('aria-activedescendant', items[idx].id);
      items[idx].scrollIntoView({ block: 'nearest' });
    }
    if(e.key==='Escape') closePalette();
  });
})();

// ── Hash routing (deep-link support) ──
window.addEventListener('hashchange', () => {
  const tab = location.hash.replace('#', '');
  const valid = ['overview','projects','github','shared','search','handoffs','supermemory'];
  if (valid.includes(tab)) switchTab(tab);
});
(function(){
  const hashTab = location.hash.replace('#', '');
  const valid = ['overview','projects','github','shared','search','handoffs','supermemory'];
  let tab = dsGet(DS_KEY_TAB, 'overview');
  if (!valid.includes(tab)) tab = 'overview';
  if (valid.includes(hashTab)) tab = hashTab;
  switchTab(tab);
})();


// ── Saved searches (single source) ──
class SavedSearchesManager{
  constructor(){this.k='omnistate_saved_searches';this.searches=this.load()}
  load(){try{return JSON.parse(localStorage.getItem(this.k)||'[]')}catch{return[]}}
  save(){localStorage.setItem(this.k, JSON.stringify(this.searches))}
  add(q,scope='all'){
    const ex=this.searches.find(s=>s.query===q&&s.scope===scope);
    if(ex){ex.lastUsed=new Date().toISOString();this.save();return}
    this.searches.unshift({id:Date.now(),query:q,scope,created:new Date().toISOString(),lastUsed:new Date().toISOString()});
    if(this.searches.length>15) this.searches.pop(); this.save();
  }
  delete(id){this.searches=this.searches.filter(s=>s.id!==id);this.save()}
  getAll(){return [...this.searches].sort((a,b)=>new Date(b.lastUsed)-new Date(a.lastUsed))}
}
const savedSearches=new SavedSearchesManager();
function toggleSavedSearchesMenu(e){e.preventDefault();const m=$('saved-searches-menu');m.classList.toggle('open');if(m.classList.contains('open')) renderSavedSearches()}
function renderSavedSearches(){
  const m=$('saved-searches-menu');const list=savedSearches.getAll();
  m.innerHTML=list.length?list.map(s=>`<div class="saved-search-item"><button type="button" style="flex:1;min-width:0;text-align:left;cursor:pointer" class="focus-visible:ring-2 focus-visible:outline-none" onclick="loadSavedSearch(${s.id})"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600">${esc(s.query.slice(0,42))}${s.query.length>42?'…':''}</div><div style="font-size:.68rem;color:var(--muted)">${esc(s.scope)}</div></button><button type="button" class="saved-search-item-delete focus-visible:ring-2 focus-visible:outline-none" onclick="deleteSavedSearch(event,${s.id})" aria-label="Remove search ${esc(s.query)}">✕</button></div>`).join('')+'<div style="padding:.55rem;text-align:center"><button type="button" class="btn ghost small" onclick="clearAllSavedSearches()">Clear all</button></div>':'<div style="padding:1rem;text-align:center;color:var(--muted)">No saved searches yet</div>';
}
function loadSavedSearch(id){const s=savedSearches.searches.find(x=>x.id===id);if(!s) return;$('search-q').value=s.query;$('search-scope').value=s.scope;$('saved-searches-menu').classList.remove('open');doSearch()}
function deleteSavedSearch(e,id){e.stopPropagation();savedSearches.delete(id);renderSavedSearches()}
function clearAllSavedSearches(){
  const prev = [...savedSearches.searches];
  savedSearches.searches=[];
  savedSearches.save();
  renderSavedSearches();
  toast('All saved searches cleared.', 'info', () => {
    savedSearches.searches = prev;
    savedSearches.save();
    renderSavedSearches();
  });
}
const _origDoSearch=window.doSearch;
window.doSearch=async function(){const q=$('search-q')?.value?.trim();const sc=$('search-scope')?.value||'all';if(q) savedSearches.add(q,sc);return _origDoSearch.apply(this,arguments)};
document.addEventListener('click',e=>{
  const m=$('saved-searches-menu'),b=$('saved-searches-btn');
  if(m&&b&&!m.contains(e.target)&&!b.contains(e.target)) m.classList.remove('open');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('saved-searches-menu')?.classList.remove('open') });

</script>
