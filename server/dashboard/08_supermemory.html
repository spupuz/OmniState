    <section id="tab-supermemory" class="tab-panel hidden" role="tabpanel">
      <div class="glass p-6">
        <div class="flex items-center gap-3 mb-4">
          <h2 class="text-xl font-bold">Supermemory</h2>
          <span id="sm-status" class="chip">⚠️ Disconnected</span>
          <button type="button" class="btn ghost ml-auto text-xs" onclick="supermemorySync()">Sync Memories</button>
        </div>
        <form class="flex gap-3 flex-wrap mb-4" onsubmit="event.preventDefault(); addSupermemoryMemory()">
          <input type="text" id="sm-content" aria-label="Memory content" placeholder="Memory content…" class="flex-1 min-w-[240px]" required>
          <input type="text" id="sm-namespace" aria-label="Namespace" placeholder="Namespace (optional)" class="w-56">
          <button type="submit" class="btn">Save to Supermemory</button>
          <button type="button" class="btn ghost" onclick="supermemorySearch()">Search</button>
        </form>
        <div id="sm-search-results" role="list"><p class="text-slate-400 text-sm">Type a query to search Supermemory.</p></div>
        <div class="mt-4">
          <h3 class="font-bold">Recent Memories</h3>
          <div id="sm-recent-memories" class="glass p-4">
            <p class="text-slate-400 text-sm">Loading recent memories…</p>
          </div>
        </div>
      </div>
    </section>
