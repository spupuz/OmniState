<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)">
<link rel="manifest" href="/manifest.json">
<title>OmniState | Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* ── Design tokens ── */
  :root{
    --bg:#070b14;
    --bg-soft:#0b1224;
    --card:rgba(15,23,42,.55);
    --card-solid:#111d36;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.14);
    --text:#f1f5f9;
    --muted:#94a3b8;
    --muted-2:#64748b;
    --accent:#3b82f6;
    --accent-2:#60a5fa;
    --accent-glow:rgba(59,130,246,.35);
    --success:#10b981;
    --warn:#f59e0b;
    --danger:#ef4444;
    --radius-sm:.5rem;
    --radius:.75rem;
    --radius-lg:1rem;
    --shadow:0 8px 32px rgba(2,6,23,.45);
    --shadow-sm:0 2px 10px rgba(2,6,23,.35);
  }
  *{scrollbar-width:thin;scrollbar-color:#1e293b transparent}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(1200px 600px at 20% -10%,rgba(59,130,246,.10),transparent 60%),radial-gradient(900px 500px at 90% 0%,rgba(16,185,129,.06),transparent 60%),var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.font-outfit{font-family:'Outfit',sans-serif;letter-spacing:-.02em}
  ::selection{background:rgba(59,130,246,.28);color:#fff}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:#334155}

  /* Cards */
  .glass{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(10px) saturate(1.15);box-shadow:var(--shadow-sm);transition:border-color .18s,box-shadow .18s,transform .18s}
  .glass:hover{border-color:rgba(59,130,246,.18)}
  .stat-card{position:relative;overflow:hidden}
  .stat-card::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;background:radial-gradient(500px 200px at 80% 0%,rgba(59,130,246,.10),transparent 60%);transition:opacity .2s;pointer-events:none}
  .stat-card:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(2,6,23,.35);border-color:rgba(59,130,246,.32)}
  .stat-card:hover::after{opacity:1}
  .glow-text{line-height:1.05;font-weight:800}

  /* Tabs */
  .tab-btn{padding:.58rem 1rem;border-radius:999px;font-size:.78rem;font-weight:650;letter-spacing:.02em;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,.02);transition:all .18s;display:inline-flex;align-items:center;gap:.45rem;min-height:40px}
  .tab-btn:hover{color:var(--text);border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.08)}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 18px var(--accent-glow)}
  .tab-btn .icon-btn{width:1.05rem;height:1.05rem;opacity:.9}
  .tab-panel{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  [role="tabpanel"]{min-height:56vh}

  /* Buttons */
  .btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:999px;padding:.52rem 1rem;font-size:.8rem;font-weight:650;cursor:pointer;transition:all .16s;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;white-space:nowrap}
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 16px var(--accent-glow)}
  .btn:active{transform:none;filter:brightness(.98)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.04);color:var(--muted);border-color:var(--border)}
  .btn.ghost:hover{background:rgba(255,255,255,.07);color:var(--text);border-color:rgba(255,255,255,.14);box-shadow:none}
  .btn.small{padding:.32rem .62rem;font-size:.72rem}

  /* Inputs */
  input,select,textarea{background:rgba(15,23,42,.55);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:.52rem .85rem;font-size:.8rem;outline:none;transition:border-color .15s,box-shadow .15s,background .15s;min-height:38px}
  textarea{border-radius:var(--radius)}
  input::placeholder,textarea::placeholder{color:#64748b}
  input:focus,select:focus,textarea:focus{border-color:rgba(59,130,246,.55);box-shadow:0 0 0 3px rgba(59,130,246,.18);background:rgba(15,23,42,.72)}
  input:focus-visible,select:focus-visible{outline:none}

  /* Tables */
  table{width:100%;border-collapse:separate;border-spacing:0}
  th,td{padding:.62rem .75rem;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
  th{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:.68rem;letter-spacing:.08em;background:rgba(255,255,255,.02);position:sticky;top:0;backdrop-filter:blur(6px)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .section-row td{text-transform:uppercase;font-size:.68rem;letter-spacing:.08em;font-weight:750;color:var(--muted);background:rgba(255,255,255,.03);padding-top:.9rem;padding-bottom:.4rem;border-bottom:1px solid rgba(255,255,255,.08)}
  td a{color:inherit;text-decoration:none;border-bottom:1px dashed transparent}
  td a:hover{color:var(--accent-2);border-bottom-color:rgba(59,130,246,.4)}

  /* Chips / badges */
  .chip{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .6rem;border-radius:999px;font-size:.72rem;font-weight:600;background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.22);color:#bfdbfe;line-height:1}
  .chip.danger{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.24);color:#fecaca}
  .chip.ok{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.22);color:#a7f3d0}
  .health-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .55rem;border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.02em}
  .health-healthy{background:rgba(16,185,129,.14);color:#6ee7b7;border:1px solid rgba(16,185,129,.28)}
  .health-attention{background:rgba(245,158,11,.14);color:#fcd34d;border:1px solid rgba(245,158,11,.28)}
  .health-warning{background:rgba(249,115,22,.14);color:#fdba74;border:1px solid rgba(249,115,22,.28)}
  .health-warning{background:rgba(249,115,22,.14);color:#fdba74;border:1px solid rgba(249,115,22,.28)}
  .health-critical{background:rgba(239,68,68,.14);color:#fca5a5;border:1px solid rgba(239,68,68,.30)}
  .glow{box-shadow:0 0 8px rgba(16,185,129,.6),0 0 16px rgba(16,185,129,.3)}
  .animate-pulse{animation:ping-constant 2s cubic-bezier(0,0,0.2,1) infinite}

  @keyframes ping-constant{
    0%,50%{opacity:1;transform:scale(1);}
    75%,100%{opacity:0;transform:scale(1.5);}
  }

  /* Misc */
  .chart-box{height:320px;position:relative}
  .kbd{font-size:.68rem;padding:.18rem .38rem;border-radius:.38rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-family:ui-monospace,monospace;color:var(--muted)}
  .copy-btn{font-size:.72rem;padding:.32rem .55rem;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--muted);cursor:pointer;transition:all .15s}
  .copy-btn:hover{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.28);color:var(--text)}
  .btn:focus-visible,.tab-btn:focus-visible,.copy-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.55);border-color:rgba(59,130,246,.8)}
  .skel{background:linear-gradient(90deg,rgba(255,255,255,.06) 25%,rgba(255,255,255,.11) 37%,rgba(255,255,255,.06) 63%);background-size:400% 100%;animation:shimmer 1.15s infinite;border-radius:.6rem}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  #toast-wrap{position:fixed;bottom:1.2rem;right:1.2rem;display:flex;flex-direction:column;gap:.5rem;z-index:9999;pointer-events:none}
  .toast{pointer-events:auto;padding:.7rem .9rem;border-radius:.8rem;font-size:.8rem;font-weight:600;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.10);animation:toastIn .20s ease;max-width:360px;border-left-width:3px}
  .toast.ok{background:#0f766e;color:#fff;border-left-color:#2dd4bf}
  .toast.err{background:#7f1d1d;color:#fecaca;border-left-color:#f87171}
  .toast.info{background:#0f172a;color:#e2e8f0;border-left-color:var(--accent)}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  #palette{position:fixed;inset:0;background:rgba(2,6,23,.48);backdrop-filter:blur(10px);z-index:9998;display:flex;align-items:flex-start;justify-content:center;padding-top:18vh}
  #palette.hidden{display:none !important}
  #palette-box{width:min(640px,92vw);background:#0f172a;border:1px solid rgba(255,255,255,.10);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
  #palette-input{width:100%;border:none;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0;padding:.9rem 1.1rem;font-size:.95rem;background:transparent}
  .palette-item{padding:.62rem 1rem;cursor:pointer;display:flex;justify-content:space-between;gap:.75rem;font-size:.84rem;border-bottom:1px solid rgba(255,255,255,.04)}
  .palette-item:hover,.palette-item.active{background:rgba(59,130,246,.12)}
  .palette-item kbd{font-size:.68rem;background:rgba(255,255,255,.07);padding:.15rem .35rem;border-radius:.3rem}
  .hidden{display:none !important}

  /* Light theme */
  [data-theme="light"]{--bg:#f1f5f9;--bg-soft:#eef2ff;--card:rgba(255,255,255,.96);--card-solid:#fff;--border:rgba(15,23,42,.10);--border-strong:rgba(15,23,42,.16);--text:#0f172a;--muted:#475569;--muted-2:#64748b;--accent:#2563eb}
  [data-theme="light"] body{background:radial-gradient(1100px 560px at 16% -8%,rgba(37,99,235,.08),transparent 62%),radial-gradient(900px 520px at 92% 0%,rgba(14,165,233,.06),transparent 60%),#f1f5f9;color:var(--text)}
  [data-theme="light"] .glass{background:rgba(255,255,255,.96);border-color:rgba(15,23,42,.08);box-shadow:0 8px 24px rgba(15,23,42,.06)}
  [data-theme="light"] th{background:rgba(15,23,42,.03);color:#334155}
  [data-theme="light"] td{border-color:rgba(15,23,42,.08);color:#1e293b}
  [data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{background:#fff;border-color:rgba(15,23,42,.14);color:#0f172a}
  [data-theme="light"] .btn.ghost{background:#fff;border-color:rgba(15,23,42,.12);color:#334155}
  [data-theme="light"] .chip{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.18);color:#1e40af}
  [data-theme="light"] .chip.danger{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.18);color:#991b1b}
  [data-theme="light"] .skel{background:linear-gradient(90deg,rgba(15,23,42,.06) 25%,rgba(15,23,42,.10) 37%,rgba(15,23,42,.06) 63%);background-size:400% 100%}
  [data-theme="light"] #palette-box{background:#fff}
  [data-theme="light"] .text-slate-400{color:#475569 !important}
  [data-theme="light"] .text-slate-300{color:#334155 !important}
  [data-theme="light"] .text-blue-300{color:#1d4ed8 !important}
  [data-theme="light"] .text-blue-400{color:#1e40af !important}
  [data-theme="light"] .text-emerald-300{color:#047857 !important}
  [data-theme="light"] .text-emerald-400{color:#065f46 !important}
  [data-theme="light"] .text-purple-300{color:#6d28d9 !important}
  [data-theme="light"] .text-purple-400{color:#5b21b6 !important}
  [data-theme="light"] .glow-text{color:#0f172a}
  [data-theme="light"] #server-status{color:#065f46 !important}

  /* Saved searches — polished */
  .saved-searches-dropdown{position:relative}
  .saved-searches-menu{position:absolute;top:calc(100% + 8px);right:0;background:rgba(15,23,42,.96);border:1px solid rgba(59,130,246,.22);border-radius:var(--radius);box-shadow:var(--shadow);min-width:320px;max-height:380px;overflow:auto;z-index:30;display:none}
  .saved-searches-menu.open{display:block;animation:pop .16s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
  .saved-search-item{padding:.6rem .85rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;border-bottom:1px solid rgba(255,255,255,.05);font-size:.78rem;transition:background .12s}
  .saved-search-item:hover{background:rgba(59,130,246,.08)}
  .saved-search-item-delete{opacity:0;color:#f87171;cursor:pointer;padding:.2rem .35rem;border-radius:999px}
  .saved-search-item:hover .saved-search-item-delete,
  .saved-search-item:focus-within .saved-search-item-delete {opacity:1}
  .saved-search-item-delete:hover{background:rgba(239,68,68,.12)}

  /* Subtle future sections (timeline/comparison placeholders) */
  .timeline-container{position:relative;padding:1rem 0}
  .timeline-line{position:absolute;left:.42rem;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--accent),transparent)}
  .timeline-item{position:relative;margin:0 0 1.1rem 2.6rem}
  .timeline-dot{position:absolute;left:-1.85rem;top:.3rem;width:1.05rem;height:1.05rem;background:var(--bg);border:2.5px solid var(--accent);border-radius:50%}

  /* ── Responsive ── */
  @media(max-width:640px){
    .tab-btn{padding:.45rem .65rem;font-size:.7rem;min-width:0}
    nav[role="tablist"]{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.25rem;gap:.5rem}
    .stat-card .text-2xl{font-size:1.25rem}
    table.responsive thead{display:none}
    table.responsive tbody tr{display:block;margin-bottom:.75rem;border:1px solid var(--border);border-radius:var(--radius);padding:.5rem}
    table.responsive td{display:flex;justify-content:space-between;gap:.5rem;padding:.35rem .5rem;border-bottom:none}
    table.responsive td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
    #toast-wrap{bottom:.6rem;right:.6rem;left:.6rem;max-width:none}
    .toast{max-width:none}
    .glass{padding:.75rem}
    header .flex{gap:.5rem}
    input.w-56,input.w-48{width:100%}
  }

  /* ── Undo toast ── */
  .toast-undo{display:flex;align-items:center;gap:.45rem}
  .toast-undo button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:.18rem .55rem;font-size:.7rem;font-weight:700;cursor:pointer;transition:background .12s}
  .toast-undo button:hover{background:rgba(255,255,255,.22)}

  /* ── Virtual scroll container ── */
  .virtual-scroll{overflow-y:auto;contain:strict}
  .virtual-scroll-inner{position:relative}
  .virtual-item{position:absolute;left:0;right:0}

  /* ── Skeleton variants ── */
  .skel-card{height:80px;border-radius:var(--radius)}
  .skel-text{height:.9rem;border-radius:.5rem}
  .skel-row{height:2.4rem;border-radius:.35rem}

  /* ── Focus visible ring ── */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .skip-link:focus{position:fixed;top:0;left:0;z-index:99999}
  /* ── Sidebar + hamburger (mobile-first) ── */
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:240px;background:var(--bg-soft);border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
  .sidebar-overlay.open{display:block}
  .hamburger{display:none !important;position:fixed;top:1rem;left:1rem;z-index:101;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5rem;cursor:pointer;color:var(--text)}
  .sidebar-nav{padding:1rem 0;flex:1}
  .sidebar-nav .tab-btn{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem 1.25rem;border-radius:0;text-align:left;background:transparent;border:none;color:var(--muted);font-size:.875rem;cursor:pointer;transition:all .15s}
  .sidebar-nav .tab-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .sidebar-nav .tab-btn.active{background:rgba(59,130,246,.1);color:var(--accent-2);border-left:3px solid var(--accent)}
  .sidebar-header{padding:1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem}
  .sidebar-header .logo{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent-2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.875rem}
  .sidebar-footer{padding:1rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted)}
  @media (max-width:1024px){
    .hamburger{display:block !important}
    .sidebar{transform:translateX(-100%) !important}
    .sidebar.open{transform:translateX(0) !important}
    .main-content{margin-left:0 !important;padding-top:4rem}
    .desktop-nav{display:none !important}
    .sidebar-overlay.open{display:block !important}
  }
  @media (min-width:1025px){
    .hamburger{display:none !important}
    .sidebar{transform:translateX(0) !important}
    .sidebar-overlay{display:none !important}
    .main-content{margin-left:240px !important}
    .desktop-nav{display:flex !important}
  }
</style>
</head>
