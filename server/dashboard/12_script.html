<script>
const $ = (id) => document.getElementById(id);
let ghTopChart = null, ghTrendChart = null;
let ghChartsReqId = 0;
try { $('auth-token').value = localStorage.getItem('omnistate_auth_token') || ''; } catch(e) {}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    btn.classList.add('active');
    $('tab-' + btn.dataset.tab).classList.remove('hidden');
    if (btn.dataset.tab === 'github') loadGithub();
    if (btn.dataset.tab === 'shared') loadShared();
    if (btn.dataset.tab === 'projects') loadProjects();
    if (btn.dataset.tab === 'handoffs') loadHandoffs();
    if (btn.dataset.tab === 'supermemory') loadSupermemory();
  });
});

function toggleSidebar() {
  const sidebar = $('sidebar');
  const overlay = $('sidebar-overlay');
  if (sidebar) sidebar.classList.toggle('open');
  if (overlay) overlay.classList.toggle('open');
}
function closeSidebarMobile() {
  const sidebar = $('sidebar');
  const overlay = $('sidebar-overlay');
  if (sidebar) sidebar.classList.remove('open');
  if (overlay) overlay.classList.remove('open');
}

async function api(path, opts) {
  const token = localStorage.getItem('omnistate_auth_token') || '';
  const baseHeaders = token ? { 'Authorization': 'Bearer ' + token } : {};
  const headers = { ...baseHeaders, ...((opts && opts.headers) || {}) };
  const { headers: _h, ...rest } = (opts || {});
  const res = await fetch(path, { cache: 'no-store', ...rest, headers });
  if (res.status === 401) {
    throw new Error('401 unauthorized — set the access token (OMNISTATE_AUTH_TOKEN) in the dashboard header.');
  }
  if (!res.ok) throw new Error(path + ' -> ' + res.status);
  return res.json();
}

function saveToken() {
  const t = ($('auth-token')?.value || '').trim();
  if (t) localStorage.setItem('omnistate_auth_token', t);
  else localStorage.removeItem('omnistate_auth_token');
  loadAll();
}

function fmt(n) { return n == null ? '—' : n.toLocaleString('it-IT'); }
function fmtDate(ts, dateOnly) {
  if (!ts) return '—';
  const s = String(ts).endsWith('Z') ? String(ts) : String(ts) + 'Z';
  const d = new Date(s);
  if (isNaN(d)) return String(ts);
  return dateOnly ? d.toLocaleDateString('it-IT') : d.toLocaleString('it-IT');
}

async function loadBackups(btn = null) {
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Refreshing…'; }
  try {
    const list = await api('/api/backups');
    const el = $('backups-list');
    if (!el) return;
    el.innerHTML = list.length ? list.map(b => `
      <div class="glass p-3" style="min-width:160px" role="listitem">
        <p class="font-bold text-sm">${esc(b.date)}</p>
        <p class="text-xs text-slate-400">${b.memories} entries · ${b.size_mb} MB</p>
      </div>`).join('') : '<p class="text-xs text-slate-400">No backups yet</p>';
  } catch (e) { console.error(e); } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

async function refreshVersionBadge() {
  try {
    const h = await api('/health');
    if (h && h.version) {
      const el = $('version-badge'); if (el) el.textContent = 'OMNISTATE v' + h.version;
      const sb = $('version-badge-sidebar'); if (sb) sb.textContent = 'v' + h.version;
      const status = $('server-status'); if (status && h.version) status.title = 'v' + h.version;
      const st = $('status-text'); if (st) st.textContent = 'SERVER';
    }
  } catch(e) {}
}
async function loadAll(btn = null) {
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Reloading…'; }
  try { await Promise.all([loadOverview(), loadProjects(), loadGithub(), loadShared(), loadHandoffs(), loadSupermemory(), loadBackups(), refreshVersionBadge()]); } finally { if (btn) { btn.disabled = false; btn.textContent = originalText; } }
}

// ---------- Overview ----------
async function loadOverview() {
  const ov=$('overview-stats'); if(ov && !ov.innerHTML.trim()) ov.innerHTML = [1,2,3,4].map(()=>`<div class="glass p-6 skel-card"><div class="skel skel-text" style="width:40%;height:.7rem;margin-bottom:.5rem"></div><div class="skel" style="width:30%;height:2rem"></div></div>`).join('');
  try {
    const stats = await api('/api/stats');
    const lu = $('last-update'); if (lu) lu.textContent = 'Last update: ' + fmtDate(stats.lastUpdate);
    const lus = $('last-update-sidebar'); if (lus) lus.textContent = 'Last update: ' + fmtDate(stats.lastUpdate);
    const cards = [
      { l: 'Projects', v: fmt(stats.projects), c: 'text-blue-400' },
      { l: 'Memory entries', v: fmt(stats.memoryEntries), c: 'text-emerald-400' },
      { l: 'Scan GitHub', v: fmt(stats.ghScans), c: 'text-purple-400' },
      { l: 'Token savings', v: fmt(Math.round(stats.tokenSavings/1000)) + 'k', c: 'text-blue-300', t: 'Real measured saving: stored raw memory tokens minus what session_start actually loads.' },
      { l: 'DB backups', v: fmt(stats.backups || 0), c: 'text-purple-400', t: 'Daily DB backups kept (last 7)' },
    ];
    if (stats.projects === 0) {
      cards.push({ l: 'Welcome', v: 'Let\'s go', c: 'text-amber-400', t: 'Register your first project: click "Projects" tab → "Register a project", or run the CLI: omnistate index /path/to/project' });
    }
    const osEl = $('overview-stats'); if (osEl) osEl.innerHTML = cards.map(c => `
      <div class="glass p-6 stat-card">
        <div class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2 flex justify-between items-start gap-2">
          <span>${c.l}</span>
          ${c.t ? `<button type="button" class="text-slate-500 hover:text-slate-300 focus-visible:ring-2 focus-visible:outline-none focus-visible:ring-blue-400 rounded-full w-4 h-4 flex items-center justify-center shrink-0 border border-slate-500/30 hover:border-slate-400/50 transition-colors" title="${esc(c.t)}" aria-label="${esc(c.t)}">i</button>` : ''}
        </div>
        <p class="text-2xl font-bold font-outfit ${c.c} leading-tight break-words">${c.v}</p>
      </div>`).join('');
    const projects = (await api('/api/projects')).filter(p => (p.category || 'active') === 'active');
    const projWrap = $('overview-projects'); if (projWrap) projWrap.innerHTML = projects.length ? projects.map(p => `
      <button type="button" class="glass p-5 stat-card w-full text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400" role="listitem" data-name="${esc(p.name)}" onclick="openProject(this.dataset.name)" title="Open project details" aria-label="Open project details">
        <p class="font-bold mb-1 truncate">${esc(p.name)}</p>
        <p class="text-xs text-slate-400 mb-3 truncate" title="${esc(p.host_path)}">${esc(p.host_path)}</p>
        <div class="flex gap-4 text-xs">
          <span class="text-blue-300">${fmt(p.activeTasks)} active</span>
          <span class="text-emerald-300">${fmt(p.doneTasks)} done</span>
          <span class="text-purple-300">${fmt(p.snapshots)} snap</span>
        </div>
      </button>`).join('') : '<p class="text-slate-400 text-sm">No active projects. Check the Projects tab for archived/deleted ones.</p>';
  } catch (e) {
    console.error(e);
    const ov = $('overview-stats');
    if (ov) ov.innerHTML = '<p class="text-red-300 text-sm col-span-2 md:col-span-4">Could not load overview: ' + esc(e.message) + ' — <button type="button" onclick="loadOverview()" class="text-blue-300 underline">Retry</button></p>';
  }
}

async function openProject(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'projects'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  $('tab-projects').classList.remove('hidden');
  await loadProjects();
  await showProject(name);
}

// ---------- Projects ----------
const PROJECT_SECTIONS = [
  { key: 'active', label: 'Active' },
  { key: 'archived', label: 'Archived' },
  { key: 'deleted', label: 'Deleted' },
];

async function loadProjects() {
  try {
    const [projects, workspaces] = await Promise.all([api('/api/projects'), api('/api/workspaces')]);
    backToProjects();
    if (!projects.length) { $('projects-table-wrap').innerHTML = '<p class="text-slate-400 text-sm">No projects. Run <code class="bg-white/10 px-1 py-0.5 rounded font-mono text-xs text-blue-300">omnistate index /path/to/project</code> or use Auto-discover.</p>'; $('projects-table-wrap').removeAttribute('tabindex'); return; }
    $('projects-table-wrap').setAttribute('tabindex', '0');
    _allProjects = projects;
    const cnt=$('projects-count'); if(cnt) cnt.textContent = projects.length + ' projects' + (workspaces.length ? ' · ' + workspaces.length + ' workspaces' : '');
    const rows = (list) => list.map(p => `
      <tr class="cursor-pointer hover:bg-white/5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 focus-visible:bg-white/5 transition-colors" tabindex="0" data-name="${esc(p.name)}" onclick="showProject(this.dataset.name)" onkeydown="if(event.key==='Enter' || event.key===' ') { event.preventDefault(); showProject(this.dataset.name); }" title="View project memory" role="button" aria-label="Open project ${esc(p.name)}">
        <td data-label="Project" class="font-semibold">${esc(p.name)}${p.workspace ? ' <span class="chip ml-1 text-xs">' + esc(p.workspace) + '</span>' : ''}</td>
        <td data-label="Done" class="num text-emerald-300">${fmt(p.doneTasks)}</td>
        <td data-label="Snapshots" class="num text-purple-300">${fmt(p.snapshots)}</td>
        <td data-label="Token savings" class="num">${fmt(Math.round(p.tokenSavings/1000))}k</td>
        <td data-label="Path" class="text-slate-400 text-xs truncate max-w-[220px]" title="${esc(p.host_path)}">${esc(p.host_path)}</td>
      </tr>`).join('');
    // Group projects by workspace for display
    const wsMap = new Map();
    for (const ws of workspaces) wsMap.set(ws.name, []);
    const wsNames = new Set(workspaces.map(w => w.name));
    const ungrouped = [];
    for (const p of projects) {
      if (p.workspace && wsMap.has(p.workspace)) wsMap.get(p.workspace).push(p);
      else if (!wsNames.has(p.name)) ungrouped.push(p);
    }
    let tableHtml = `<table class="responsive"><thead><tr>
        <th>Project</th><th class="num">Done</th>
        <th class="num">Snapshots</th><th class="num">Token savings</th><th>Path</th>
      </tr></thead><tbody>`;
    for (const [wsName, wsProjects] of wsMap) {
      if (!wsProjects.length) continue;
      const ws = workspaces.find(w => w.name === wsName);
      tableHtml += `<tr class="section-row"><td colspan="5">📁 ${esc(wsName)} <span class="text-slate-500 font-normal">(${wsProjects.length} projects)</span></td></tr>`;
      tableHtml += rows(wsProjects);
    }
    tableHtml += PROJECT_SECTIONS.map(s => {
      const list = ungrouped.filter(p => (p.category || 'active') === s.key);
      if (!list.length) return '';
      return `<tr class="section-row"><td colspan="5">${s.label} <span class="text-slate-500 font-normal">(${list.length})</span></td></tr>${rows(list)}`;
    }).join('');
    tableHtml += '</tbody></table>';
    $('projects-table-wrap').innerHTML = tableHtml;
  } catch (e) {
    console.error(e);
    const wrap = $('projects-table-wrap');
    if (wrap) wrap.innerHTML = '<p class="text-red-300 text-sm">Could not load projects: ' + esc(e.message) + ' — <button type="button" onclick="loadProjects()" class="text-blue-300 underline">Retry</button></p>';
  }
}

async function showProject(name) {
  try {
    const d = await api('/api/projects/' + encodeURIComponent(name));
    window._pmEntries = d.memory || [];
    const m = d.metrics;
    $('projects-table-wrap').classList.add('hidden');
    const el = $('project-detail');
    el.classList.remove('hidden');
    el.innerHTML = `
      <div class="flex items-center gap-3 mb-5 flex-wrap">
        <button type="button" class="btn ghost" onclick="backToProjects()">← Back</button>
        <h2 id="project-detail-heading" tabindex="-1" class="text-xl font-bold focus:outline-none">${esc(name)}</h2>
        <span class="chip">${esc(d.category || 'active')}</span>
        <span class="text-xs text-slate-500 truncate max-w-[280px]" title="${esc(d.project.host_path)}">${esc(d.project.host_path)}</span>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="glass p-5"><p class="text-xs text-slate-400 uppercase tracking-widest mb-1">Active tasks</p><p class="text-2xl font-bold text-blue-300">${fmt(m.activeTasks)}</p></div>
        <div class="glass p-5"><p class="text-xs text-slate-400 uppercase tracking-widest mb-1">Done tasks</p><p class="text-2xl font-bold text-emerald-300">${fmt(m.doneTasks)}</p></div>
        <div class="glass p-5"><p class="text-xs text-slate-400 uppercase tracking-widest mb-1">Snapshots</p><p class="text-2xl font-bold text-purple-300">${fmt(m.snapshots)}</p></div>
        <div class="glass p-5"><p class="text-xs text-slate-400 uppercase tracking-widest mb-1">Token savings</p><p class="text-2xl font-bold">${fmt(Math.round(m.tokenSavings/1000))}k</p></div>
      </div>
      <div class="flex gap-3 flex-wrap items-center mb-4 flex-wrap">
        <h3 class="font-bold">Memory entries</h3>
        <input type="search" id="pm-filter" aria-label="Filter project memory entries" class="ml-auto" placeholder="Filter entries…" oninput="renderPmEntries()">
        <button type="button" id="handoff-btn" class="btn ghost text-xs" onclick="showHandoffForm()">+ Handoff</button>
      </div>
      <div id="pm-entries" role="list"></div>
      <div id="handoff-form" class="hidden mt-4" role="list"></div>`;
    renderPmEntries();
    // Add project actions buttons to header
    const header = el.querySelector('.flex.items-center.gap-3.mb-5.flex-wrap');
    if (header && !header.querySelector('.proj-actions')) {
      const actions = document.createElement('div');
      actions.className = 'ml-auto flex gap-2 proj-actions';
      
      const btnMerge = document.createElement('button');
      btnMerge.type = 'button';
      btnMerge.className = 'btn ghost small';
      btnMerge.textContent = 'Merge into…';
      btnMerge.addEventListener('click', () => mergeProject(name));
      
      const btnRemove = document.createElement('button');
      btnRemove.type = 'button';
      btnRemove.className = 'btn ghost small danger';
      btnRemove.textContent = 'Remove project';
      btnRemove.addEventListener('click', () => removeProject(name));
      
      actions.appendChild(btnMerge);
      actions.appendChild(btnRemove);
      header.appendChild(actions);
    }
    const heading = document.getElementById('project-detail-heading');
    if (heading) heading.focus();
  } catch (e) { console.error(e); $('projects-table-wrap').classList.remove('hidden'); }
}

function renderPmEntries() {
  const q = ($('pm-filter')?.value || '').toLowerCase();
  window._pmEntriesFiltered = (window._pmEntries || []).filter(e =>
    !q || (e.title||'').toLowerCase().includes(q) || (e.content||'').toLowerCase().includes(q));
  const list = window._pmEntriesFiltered;
  const container = $('pm-entries');
  if(!container) return;
  if(list.length > 50){
    renderChunked(container, list, (e, idx) => {
      let tags = '';
      try { tags = JSON.parse(e.tags || '[]').map(t => `<span class="chip">#${esc(t)}</span>`).join(''); } catch(_) { tags = ''; }
      const div = document.createElement('div'); div.className='glass p-4 mb-3'; div.setAttribute('role','listitem'); div.style.position='absolute'; div.style.left='0'; div.style.right='0'; div.style.top=(idx*64)+'px';
      div.innerHTML = `
        <div class="flex justify-end gap-2 mb-2"><button type="button" class="copy-btn" aria-label="Copy text" onclick="copyText(this, window._pmEntriesFiltered[${idx}].content||window._pmEntriesFiltered[${idx}].title||'')">Copy</button><button type="button" class="copy-btn" onclick="reinforceMemory(window._pmEntriesFiltered[${idx}].memory_id||window._pmEntriesFiltered[${idx}].id||0, 'used', this)" aria-label="Mark as useful" title="Mark as useful">👍</button><button type="button" class="copy-btn" onclick="reinforceMemory(window._pmEntriesFiltered[${idx}].memory_id||window._pmEntriesFiltered[${idx}].id||0, 'important', this)" aria-label="Mark as important" title="Mark as important">⭐</button></div>
        <div class="flex justify-between gap-4 items-center flex-wrap">
          <div class="flex items-center gap-2">
            <span class="chip">${esc(e.kind)}</span>
            ${e.lifecycle_state && e.lifecycle_state !== 'active' ? `<span class="chip danger">${esc(e.lifecycle_state)}</span>` : ''}
            <p class="font-semibold">${esc(e.title || '(untitled)')}</p>
          </div>
          <span class="text-xs text-slate-500">${fmtDate(e.created_at)}</span>
        </div>
        ${(e.importance ?? e.importance !== undefined) ? `<div class="mt-1 text-xs text-slate-500">importance ${Math.round((e.importance||0)*100)}% · exposed ${e.access_count||0}x</div>` : ''}
        <p class="text-sm text-slate-400 mt-1 whitespace-pre-wrap">${esc((e.content||'').slice(0, 300))}${(e.content||'').length > 300 ? '…' : ''}</p>
        ${tags ? `<div class="mt-2">${tags}</div>` : ''}
      `;
      return div;
    }, 40, 600);
    return;
  }
  let tags = '';
  container.innerHTML = list.length ? list.map((e, idx) => {
    try { tags = JSON.parse(e.tags || '[]').map(t => `<span class="chip">#${esc(t)}</span>`).join(''); } catch(_) { tags = ''; }
    return `
    <div class="glass p-4 mb-3" role="listitem">
      <div class="flex justify-end gap-2 mb-2"><button type="button" class="copy-btn" aria-label="Copy text" onclick="copyText(this, window._pmEntriesFiltered[idx].content||window._pmEntriesFiltered[idx].title||'')">Copy</button><button type="button" class="copy-btn" onclick="reinforceMemory(window._pmEntriesFiltered[idx].memory_id||window._pmEntriesFiltered[idx].id||0, 'used', this)" aria-label="Mark as useful" title="Mark as useful">👍</button><button type="button" class="copy-btn" onclick="reinforceMemory(window._pmEntriesFiltered[idx].memory_id||window._pmEntriesFiltered[idx].id||0, 'important', this)" aria-label="Mark as important" title="Mark as important">⭐</button></div>
      <div class="flex justify-between gap-4 items-center flex-wrap">
        <div class="flex items-center gap-2">
          <span class="chip">${esc(e.kind)}</span>
          ${e.lifecycle_state && e.lifecycle_state !== 'active' ? `<span class="chip danger">${esc(e.lifecycle_state)}</span>` : ''}
          <p class="font-semibold">${esc(e.title || '(untitled)')}</p>
        </div>
        <span class="text-xs text-slate-500">${fmtDate(e.created_at)}</span>
      </div>
      ${(e.importance ?? e.importance !== undefined) ? `<div class="mt-1 text-xs text-slate-500">importance ${Math.round((e.importance||0)*100)}% · exposed ${e.access_count||0}x</div>` : ''}
      <p class="text-sm text-slate-400 mt-1 whitespace-pre-wrap">${esc((e.content||'').slice(0, 300))}${(e.content||'').length > 300 ? '…' : ''}</p>
      ${tags ? `<div class="mt-2">${tags}</div>` : ''}
    </div>`;
  }).join('') : '<p class="text-slate-400 text-sm">No memory entries.</p>';
}

function backToProjects() {
  const el = $('project-detail');
  if (el) { el.classList.add('hidden'); el.innerHTML = ''; }
  const wrap = $('projects-table-wrap');
  if (wrap) {
    wrap.classList.remove('hidden');
    wrap.focus();
  }
}

let _pendingRemoveName = null;
function openRemoveModal(name) {
  _pendingRemoveName = name;
  $('remove-project-name').textContent = name;
  $('remove-reason').value = '';
  $('remove-project-modal').classList.remove('hidden');
  $('remove-reason').focus();
}
function closeRemoveModal() {
  $('remove-project-modal').classList.add('hidden');
  _pendingRemoveName = null;
}
async function submitRemove() {
  const name = _pendingRemoveName;
  if (!name) return;
  const reason = $('remove-reason').value.trim();

  const btn = document.querySelector('#remove-form button[type="submit"]');
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Removing…'; }
  try {
    await api(`/api/projects/${encodeURIComponent(name)}/remove`, {method: 'POST'});
    toast(`Project "${name}" removed`, 'ok');
    closeRemoveModal();
    loadProjects();
    backToProjects();
  } catch(e) {
    toast('Remove failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}
async function removeProject(name) {
  openRemoveModal(name);
}

let _pendingMergeSource = null;
async function openMergeModal(source) {
  _pendingMergeSource = source;
  $('merge-source-name').textContent = source;
  $('merge-target-select').value = '';
  $('merge-target-path').value = '';
  // Populate dropdown with active projects
  const sel = $('merge-target-select');
  // Keep first option
  const first = sel.options[0];
  sel.innerHTML = '';
  sel.appendChild(first);
  try {
    const projects = await api('/api/projects');
    const active = projects.filter(p => (p.category || 'active') === 'active' && p.name !== source);
    active.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = `${p.name} (${p.host_path})`;
      sel.appendChild(opt);
    });
  } catch(e) {
    console.error('Failed to load projects for merge dropdown', e);
  }
  $('merge-project-modal').classList.remove('hidden');
  $('merge-target-select').focus();
}
function closeMergeModal() {
  $('merge-project-modal').classList.add('hidden');
  _pendingMergeSource = null;
}
async function submitMerge() {
  const source = _pendingMergeSource;
  if (!source) return;
  const selectVal = $('merge-target-select').value.trim();
  const pathVal = $('merge-target-path').value.trim();
  let target = selectVal || pathVal;
  if (!target) {
    toast('Select an existing target project or enter a new path', 'err');
    return;
  }
  if (target === source) {
    toast('Source and target must be different', 'err');
    return;
  }

  const btn = document.querySelector('#merge-form button[type="submit"]');
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Merging…'; }
  // If target is a path not a project name, try to register it first
  try {
    // Check if project exists
    const projects = await api('/api/projects');
    const exists = projects.some(p => p.name === target);
    if (!exists && pathVal) {
      // Attempt to register new project by path
      await api('/api/register', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({path: target})});
      // Re-fetch to get actual name
      const projects2 = await api('/api/projects');
      const newProj = projects2.find(p => p.host_path === target);
      if (newProj) target = newProj.name;
    }
    await api('/api/projects/merge', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({source, target})});
    toast(`Merged "${source}" → "${target}"`, 'ok');
    closeMergeModal();
    loadProjects();
    backToProjects();
  } catch(e) {
    toast('Merge failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}
async function mergeProject(source) {
  await openMergeModal(source);
}

function showHandoffForm() {
  const form = $('handoff-form');
  if (!form) return;
  form.classList.remove('hidden');
  form.innerHTML = `

async function deleteShared(id) {
  const el = $('shared-item-' + id);
  if (el) { el.style.opacity = '0.5'; el.style.pointerEvents = 'none'; }
  let aborted = false;
  toast('Memory entry deleted.', 'info', () => {
    aborted = true;
    if (el) { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; }
  });

  setTimeout(async () => {
    if (aborted) return;
    try {
      await api('/api/shared/' + id, { method: 'DELETE' });
      loadShared(); // reload to update count
    } catch (e) {
      toast(e.message, 'err');
      if (el) { el.style.opacity = '1'; el.style.pointerEvents = 'auto'; }
    }
  }, 5200); // Wait slightly longer than the 5000ms toast timeout to ensure undo is not clicked late
}

  const sc=$('search-count'); if(sc) sc.textContent='Searching…';

    const scope = $('search-scope').value;
    const project = ($('search-project')?.value||'').trim();
    const startDate = $('search-start')?.value || '';
    const endDate = $('search-end')?.value || '';
    const limit = $('search-limit')?.value || '20';
    let url = '/api/memory?q=' + encodeURIComponent(q) + '&scope=' + scope + '&limit=' + limit;

    $('search-results').innerHTML = results.length ? results.map(m => `
      <div class="glass p-4 mb-3" role="listitem">
        <div class="flex justify-between gap-4 flex-wrap">
          <p class="font-semibold">${esc(m.title || '(untitled)')}</p>
          <span class="text-xs text-slate-500">${esc(m.scope)}${m.project_name ? ' · ' + esc(m.project_name) : ''} · ${fmtDate(m.created_at, true)}</span>
        </div>
        <p class="text-sm text-slate-400 mt-1 whitespace-pre-wrap">${esc((m.content||'').slice(0, 380))}</p>
        <div class="flex gap-2 mt-3 flex-wrap">
          <span class="chip">${esc(m.kind)}</span>
          ${m.source ? `<span class="chip">src: ${esc(m.source)}</span>` : ''}
          ${m.valid_until ? `<span class="chip danger">expires ${fmtDate(m.valid_until, true)}</span>` : ''}
          ${m.valid_from ? `<span class="chip">from ${fmtDate(m.valid_from, true)}</span>` : ''}
          <span class="chip">imp: ${Math.round((m.importance||0)*100)}%</span>
        </div>
        <div class="flex gap-2 mt-2 flex-wrap">
          <button type="button" class="copy-btn" aria-label="Copy text" onclick="copyText(this, this.dataset.v)" data-v="${esc(m.content||m.title||'')}">Copy</button>
          <button type="button" class="copy-btn" aria-label="Mark as useful" title="Mark as useful" onclick="reinforceMemory(${m.memory_id||m.id||0}, 'used', this)">👍 useful</button>
          <button type="button" class="copy-btn" aria-label="Mark as important" title="Mark as important" onclick="reinforceMemory(${m.memory_id||m.id||0}, 'important', this)">⭐ important</button>
          <button type="button" class="copy-btn" aria-label="Forget memory" title="Forget memory" onclick="forgetMemory(${m.memory_id||m.id||0})">🗑 forget</button>
        </div>
      </div>`).join('') : '<p class="text-slate-400 text-sm">No results. Try a broader query or change scope/project filter.</p>';
  } catch (e) { console.error(e); toast(String(e).slice(0,140),'err'); if($('search-count')) $('search-count').textContent='error'; }

async function loadGithub(btn = null) {
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Refreshing…'; }
  try {
    const [cfg, metrics, delta, history] = await Promise.all([
      api('/api/github/config'), api('/api/github/metrics'), api('/api/github/delta'), api('/api/github/history')
    ]);
    $('gh-accounts').value = (cfg.accounts||[]).join(', ');
    // Load advanced settings
    $('gh-extended').checked = !!cfg.extended;
    $('gh-include-forks').checked = !!cfg.include_forks;
    $('gh-include-archived').checked = !!cfg.include_archived;
    $('gh-scan-interval').value = cfg.scan_interval_hours || 6;
    $('gh-stale-days').value = cfg.stale_days || 30;
    const t = cfg.token || {};
    $('gh-token-info').textContent = t.token_set ? ('token: ' + (t.login || '?') + ' · ' + (t.scopes||[]).join('+') + (t.valid === false ? ' (invalid)' : '')) : 'no token (REST mode)';
    if (metrics.error) { $('github-stats').innerHTML = '<p class="text-slate-400">No scans yet. Click "Scan now".</p>'; return; }
    $('github-stats').innerHTML = [
      { l: 'Repos scanned', v: fmt(metrics.total_repos), c: 'text-blue-400', s: 'text-2xl' },
      { l: 'Total open PRs', v: fmt(metrics.total_prs), c: 'text-emerald-400', s: 'text-2xl' },
      { l: 'Method', v: esc(metrics.method), c: 'text-purple-400', s: 'text-lg' },
      { l: 'Last scan', v: fmtDate(metrics.timestamp).slice(0, 17), c: 'text-slate-300', s: 'text-sm md:text-base' },
    ].map(c => `<div class="glass p-6 stat-card" role="listitem"><p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">${c.l}</p><p class="${c.s} font-bold font-outfit ${c.c} leading-tight break-words">${c.v}</p></div>`).join('');
    $('gh-delta-text').textContent = delta.error ? delta.error : `Δ PR: ${delta.delta_prs >= 0 ? '+' : ''}${fmt(delta.delta_prs)} · Δ repos: ${delta.delta_repos >= 0 ? '+' : ''}${fmt(delta.delta_repos)} (${fmtDate(delta.latest)} vs ${fmtDate(delta.previous)})`;
    renderGhRepos();
    renderGhCharts(history, metrics);
    loadGhAggs();
    // Load preference for "Only with open PRs" checkbox
    await loadGithubPreference();
  } catch (e) {
    console.error(e);
    $('github-stats').innerHTML = `<p class="text-red-400 text-sm">Could not load GitHub data: ${esc(e.message)}</p>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = originalText; }
  }
}

// Preference handling for GitHub "Only with open PRs" checkbox
const PREF_NOTE_PREFIX = 'GH_ONLY_PR_';

async function loadGithubPreference() {
  try {
    const sharedNotes = await api('/api/shared');
    const note = sharedNotes.find(n => (n.title || '').startsWith(PREF_NOTE_PREFIX));
    if (note) {
      // Content is stored as PREF_NOTE_PREFIX + "true"/"false"
      const checked = (note.content || '').trim().toUpperCase() === PREF_NOTE_PREFIX + 'TRUE';
      $('gh-only-prs').checked = checked;
      // Immediately render repos with the loaded preference
      renderGhRepos();
    }
  } catch (e) {
    console.error('Failed to load GitHub preference:', e);
  }
}

async function saveGithubPreference(checked) {
  try {
    // First, delete any existing note with this prefix to avoid duplicates
    const sharedNotes = await api('/api/shared');
    for (const n of sharedNotes || []) {
      if ((n.title || '').startsWith(PREF_NOTE_PREFIX)) {
        await api(`/api/shared/${n.id}`, { method: 'DELETE' });
      }
    }
    // Store the boolean; the API derives title/content from "text"
    await api('/api/shared', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({text: PREF_NOTE_PREFIX + checked.toString(), tags: ''})
    });
  } catch (e) {
    console.error('Failed to save GitHub preference:', e);
    toast('Could not save preference', 'err');
  }
}

async function runGhScan() {
  const accountsInput = $('gh-accounts').value.trim();
  const accounts = accountsInput ? accountsInput.split(',').map(s => s.trim()).filter(s => s) : [];
  const btn = document.querySelector('#tab-github button[type="submit"]');
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Scanning…'; }
  try {
    // Persist accounts to config so they survive reload
    if (accounts.length > 0) {
      await api('/api/github/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({accounts}) });
    }
    await api('/api/github/scan', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({accounts: accounts.length ? accounts : undefined}) });
    // Await the reload so the numbers are guaranteed to reflect the new scan.
    await loadGithub();
  } catch (e) {
    toast('Scan failed: ' + e.message, 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

async function renderGhRepos() {
  try {
    const repos = await api('/api/github/repos');
    if (!repos.length) { $('github-repos').innerHTML = '<p class="text-slate-400 text-sm">No scans yet.</p>'; $('github-repos').removeAttribute('tabindex'); return; }
    $('github-repos').setAttribute('tabindex', '0');
    const only = $('gh-only-prs').checked;
    const filtered = only ? repos.filter(r => r.open_prs > 0) : repos;
    // Only link out to github.com repo URLs; anything else renders as plain text.
    const base = r => (typeof r.url === 'string' && /^https:\/\/github\.com\/[^/]+\/[^/]+/.test(r.url)) ? r.url.replace(/\/+$/, '') : '';
    const link = (u, text, title) => u
      ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(title || u)}">${text}</a>`
      : `${text}`;
    $('github-repos').innerHTML = `
      <table class="responsive"><thead><tr>
        <th>Repo</th><th class="num">PR</th><th class="num">Draft</th><th class="num">No rev</th>
        <th class="num">Stale</th><th class="num">Issues</th><th class="num">Stars</th><th>Language</th>
      </tr></thead><tbody>
      ${filtered.map(r => {
        const u = base(r);
        return `
        <tr>
          <td data-label="Repo" class="font-semibold">${link(u, esc(r.full_name), 'Open repository')}</td>
          <td class="num text-emerald-300">${link(u + '/pulls', r.open_prs ?? '—', 'Open pull requests')}</td>
          <td data-label="Draft" class="num">${link(u + '/pulls?q=is%3Apr+is%3Aopen+draft%3Atrue', r.draft_prs ?? '—', 'Draft pull requests')}</td>
          <td data-label="No rev" class="num text-amber-300">${link(u + '/pulls?q=is%3Apr+is%3Aopen+no%3Areview', r.no_reviewer ?? '—', 'Pull requests with no review')}</td>
          <td data-label="Stale" class="num text-red-300">${link(u + '/pulls?sort=created&direction=asc', r.stale_prs ?? '—', 'Oldest open pull requests')}</td>
          <td data-label="Issues" class="num">${link(u + '/issues', r.open_issues ?? '—', 'Open issues')}</td>
          <td data-label="Stars" class="num">${link(u + '/stargazers', r.stars ?? 0, 'Stargazers')}</td>
          <td data-label="Language" class="text-slate-400">${esc(r.language || '')}</td>
        </tr>`;
      }).join('')}
      </tbody></table>`;
  } catch (e) { console.error(e); }
}

function renderGhCharts(history, metrics) {
  const reqId = ++ghChartsReqId;
  // Destroy any existing chart instances bound to these canvases (including
  // orphaned ones from previous/aborted renders) before recreating.
  try { if (ghTrendChart) { ghTrendChart.destroy(); } } catch (e) { console.warn(e); }
  ghTrendChart = null;
  try { if (ghTopChart) { ghTopChart.destroy(); } } catch (e) { console.warn(e); }
  ghTopChart = null;
  const trendEl = $('chartGhTrend');
  const topEl = $('chartGhTop');
  if (trendEl) { const c = (typeof Chart !== 'undefined') ? Chart.getChart(trendEl) : null; if (c) { try { c.destroy(); } catch (e) { console.warn(e); } } }
  if (topEl) { const c = (typeof Chart !== 'undefined') ? Chart.getChart(topEl) : null; if (c) { try { c.destroy(); } catch (e) { console.warn(e); } } }

  const trendData = (history.trend||[]).map(t => t.total_prs);
  const minTrend = trendData.length ? Math.min(...trendData) : 0;
  const maxTrend = trendData.length ? Math.max(...trendData) : 0;
  if (trendEl) {
    trendEl.setAttribute('role', 'img');
    trendEl.setAttribute('aria-label', `Open PR trend: min ${minTrend}, max ${maxTrend}`);

    ghTrendChart = new Chart(trendEl, {
      type: 'line',
      data: { labels: (history.trend||[]).map(t => fmtDate(t.timestamp, true)), datasets: [{ label: 'Open PR', data: trendData, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.2)', fill: true, tension: .3 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8' } } }, scales: { x: { ticks: { color: '#64748b' } }, y: { ticks: { color: '#64748b' } } } }
    });
  }

  // top repos chart: fetch repos again
  api('/api/github/repos').then(repos => {
    if (reqId !== ghChartsReqId) {
      // Stale render: do not draw.
      return;
    }
    const top = (repos || []).slice(0, 8);
    const topEl2 = $('chartGhTop');
    if (!topEl2) return;
    // Destroy any chart currently bound to the canvas before creating a new one.
    const existing = (typeof Chart !== 'undefined') ? Chart.getChart(topEl2) : null;
    if (existing) { try { existing.destroy(); } catch (e) { console.warn(e); } }
    if (ghTopChart) { try { ghTopChart.destroy(); } catch (e) { console.warn(e); } ghTopChart = null; }
    topEl2.setAttribute('role', 'img');
    if (top.length > 0) {
      const topRepo = top.reduce((prev, current) => (prev.open_prs > current.open_prs) ? prev : current);
      topEl2.setAttribute('aria-label', `Top repos by open PRs. Repo principale: ${topRepo.full_name} con ${topRepo.open_prs} PR`);
    } else {
      topEl2.setAttribute('aria-label', 'Top repos by open PRs. Nessun dato disponibile.');
    }

    ghTopChart = new Chart(topEl2, {
      type: 'bar',
      data: { labels: top.map(r => r.full_name), datasets: [{ label: 'Open PR', data: top.map(r => r.open_prs || 0), backgroundColor: 'rgba(59,130,246,.6)', borderRadius: 8 }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#64748b' } }, y: { ticks: { color: '#94a3b8', font: { size: 11 } } } } }
    });
  }).catch(e => { console.error(e); });
}

async function loadGhAggs() {

// ---------- utils ----------
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);

}

// ---------- virtual scroll (chunked rendering for large lists) ----------
function renderChunked(container, items, renderFn, batchSize=40, containerHeight=600){
  if(!items.length){ container.innerHTML='<p class="text-slate-400 text-sm">No items.</p>'; return; }
  container.innerHTML='';
  const wrapper=document.createElement('div'); wrapper.style.position='relative'; wrapper.style.width='100%';
  const totalH=items.length*64; // estimated row height
  wrapper.style.height=totalH+'px'; wrapper.style.overflowY='auto'; wrapper.style.contain='strict';
  const visible=document.createElement('div'); visible.style.position='relative'; visible.style.width='100%';
  wrapper.appendChild(visible);
  container.appendChild(wrapper);
  let rendered=0;
  function renderBatch(){
    const scrollTop=wrapper.scrollTop;
    const start=Math.max(0, Math.floor(scrollTop/64)-2);
    const end=Math.min(items.length, start+batchSize+4);
    visible.innerHTML='';
    visible.style.height=totalH+'px';
    const inner=document.createElement('div'); inner.style.position='absolute'; inner.style.top=(start*64)+'px'; inner.style.left=0; inner.style.right=0;
    for(let i=start;i<end;i++) inner.appendChild(renderFn(items[i], i));
    rendered=end;
    if(rendered<items.length) requestAnimationFrame(renderBatch);
  }
  wrapper.addEventListener('scroll', ()=>{ if(rendered<items.length||wrapper.scrollTop<rendered*batchSize*64) renderBatch(); }, {passive:true});
  renderBatch();
}

class SavedSearchesManager{
  constructor(){this.k='omnistate_saved_searches';this.searches=this.load()}
  load(){try{return JSON.parse(localStorage.getItem(this.k)||'[]')}catch{return[]}}
  save(){localStorage.setItem(this.k, JSON.stringify(this.searches))}
  add(q,scope='all'){
    const ex=this.searches.find(s=>s.query===q&&s.scope===scope);
    if(ex){ex.lastUsed=new Date().toISOString();this.save();return}
    this.searches.unshift({id:Date.now(),query:q,scope,created:new Date().toISOString(),lastUsed:new Date().toISOString()});
    if(this.searches.length>15) this.searches.pop(); this.save();
  }
  delete(id){this.searches=this.searches.filter(s=>s.id!==id);this.save()}
  getAll(){return [...this.searches].sort((a,b)=>new Date(b.lastUsed)-new Date(a.lastUsed))}
}

}
function loadSavedSearch(id){const s=savedSearches.searches.find(x=>x.id===id);if(!s) return;$('search-q').value=s.query;$('search-scope').value=s.scope;$('saved-searches-menu').classList.remove('open');doSearch()}
function deleteSavedSearch(e,id){e.stopPropagation();savedSearches.delete(id);renderSavedSearches()}
function clearAllSavedSearches(){
  const prev = [...savedSearches.searches];
  savedSearches.searches=[];
  savedSearches.save();
  renderSavedSearches();
  toast('All saved searches cleared.', 'info', () => {
    savedSearches.searches = prev;
    savedSearches.save();
    renderSavedSearches();
  });
}
const _origDoSearch=window.doSearch;
window.doSearch=async function(){const q=$('search-q')?.value?.trim();const sc=$('search-scope')?.value||'all';if(q) savedSearches.add(q,sc);return _origDoSearch.apply(this,arguments)};
document.addEventListener('click',e=>{
  const m=$('saved-searches-menu'),b=$('saved-searches-btn');
  if(m&&b&&!m.contains(e.target)&&!b.contains(e.target)) m.classList.remove('open');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('saved-searches-menu')?.classList.remove('open') });

</script>
