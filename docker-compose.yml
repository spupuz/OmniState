services:
  omnistate:
    build: .
    container_name: omnistate
    env_file: .env
    ports:
      - "${OMNISTATE_HOST_PORT:-8347}:8347"
    volumes:
      # Host projects: READ-ONLY, never written by the server
      - ${PROJECTS_ROOT:-/home/youruser/projects}:/workspaces:ro
      # DB + shared memory: a plain folder on the host (DATA_HOST_DIR in .env), never on GitHub
      - ${DATA_HOST_DIR:-./data}:/data
    environment:
      - OMNISTATE_PORT=8347
      - OMNISTATE_DATA=/data
      # host path -> container path translation for MCP tools
      - OMNISTATE_ROOTS=${PROJECTS_ROOT:-/home/youruser/projects}:/workspaces
      - OMNISTATE_SCAN_INTERVAL_SECONDS=${OMNISTATE_SCAN_INTERVAL_SECONDS:-}
      - OMNISTATE_AUTO_IMPORT_LEGACY=${OMNISTATE_AUTO_IMPORT_LEGACY:-}
    restart: unless-stopped